<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>妖怪快遞社：夜行配達 — Yokai Delivery Service</title>
  <!-- Google Web Fonts: 和風書法字體與圓體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #080c1a;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: 'Zen Maru Gothic', 'Noto Sans JP', -apple-system, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #141b36 0%, #060914 100%);
    }
    canvas {
      width: min(100vw, 150dvh);
      height: auto;
      max-height: 100dvh;
      aspect-ratio: 3 / 2;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.75), 0 0 0 2px #263354;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" aria-label="妖怪快遞社：夜行配達"></canvas>
  </div>

  <script src="js/words.js"></script>
  <script src="js/store.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
