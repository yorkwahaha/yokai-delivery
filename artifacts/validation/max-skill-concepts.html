<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAX 技能・A/B 動態草案</title>
<style>body{margin:0;background:#101521;color:#f1e7ce;font:16px system-ui;padding:28px}main{max-width:1080px;margin:auto}h1{font-size:26px;color:#eed39a}p{color:#b6c1cf;line-height:1.6}button{background:#293347;border:1px solid #a89870;color:#f1e7ce;border-radius:8px;padding:9px 18px;cursor:pointer}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}article{background:#1c2330;border:1px solid #465064;border-radius:12px;overflow:hidden}h2{font-size:19px;margin-top:32px}h3{font-size:17px;margin:14px 18px 8px}article p{margin:8px 18px 18px;font-size:14px;min-height:44px}canvas{display:block;width:100%;background:#182026}small{color:#a4b4c8}@media(max-width:620px){.pair{grid-template-columns:1fr}body{padding:16px}}</style>
<main><h1>MAX 技能・A／B 動態草案</h1><p>先選視覺方向；以下是獨立概念示意，尚未接入遊戲。保留現有傷害、範圍與攻擊數量。正式版本會再貼合角色素材與命中節奏。</p><button id="toggle">暫停動態</button> <small>每 2.4 秒重播；尊重減少動態設定。按鈕可開啟播放。</small><div id="board"></div></main>
<script>
const specs=[
 ['katana','妖刀斬',['A・月牙破風','一片清楚的青白月牙飛出，金色刃口與短尾流，命中瞬間碎成三片。'],['B・墨金拔刀','墨色筆觸劃開空間，細金刃線跟隨；飛行斬波呈長形裂痕，沒有大片光霧。']],
 ['barrier','淨化靈陣',['A・八方鳥居','青白雙環從腳下展開，八方鳥居光影短暫立起，再由周邊向外推出光波。'],['B・御札封陣','紙符依序落在八方，硃砂線連成結界；啟動時整圈金白亮起，紙符燃成灰。']],
 ['needle','天狐靈針',['A・冰晶狐牙','八枚青白狐牙沿弧線展開，清楚的尖端與細短尾跡，轉彎後直飛。'],['B・八星流矢','八道金白流星從扇形軌跡轉向；小星芒在命中點亮一下，冷色尾流迅速退去。']],
 ['boom','陰陽符',['A・御札爆印','爆符命中先蓋下朱印，紙角燃亮；中央爆光後，一圈金色震波擴散。'],['B・陰陽裂焰','黑白陰陽印短暫收束，沿中線裂開；橘金焰片向外散開，爆炸中心迅速清空。']],
 ['fire','狐火炎',['A・追魂小狐','六團鬼火化為透明小狐輪廓；尾巴拉出短焰，接近目標時撲擊再散成火星。'],['B・六燈巡魂','六枚小提燈狀鬼火追擊；燈內白芯、外緣青焰，命中時燈影熄滅並留一圈餘火。']],
 ['thunder','天狐雷',['A・雷鼓天落','空中一枚雷鼓印亮起，主雷柱落地後沿地面分岔；亮點只留在命中區。'],['B・四門雷獄','範圍邊緣短暫浮出四座雷光鳥居，電弧連接四門，再收束成範圍內落雷。']]
];
const board=document.querySelector('#board'),cards=[];
for(const [id,name,...options] of specs){const title=document.createElement('h2');title.textContent=name;board.append(title);const pair=document.createElement('div');pair.className='pair';board.append(pair);options.forEach(([label,description],variant)=>{const card=document.createElement('article');card.innerHTML='<h3></h3><canvas width="480" height="220"></canvas><p></p>';card.querySelector('h3').textContent=label;card.querySelector('p').textContent=description;pair.append(card);cards.push({id,variant,ctx:card.querySelector('canvas').getContext('2d')});});}
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,clock=0,last=0;const toggle=document.querySelector('#toggle');const label=()=>toggle.textContent=paused?'播放動態':'暫停動態';label();toggle.onclick=()=>{paused=!paused;label();};
const TAU=Math.PI*2;
function line(c,points,color,w=2){c.strokeStyle=color;c.lineWidth=w;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}
function ring(c,x,y,r,color,w=2){c.strokeStyle=color;c.lineWidth=w;c.beginPath();c.ellipse(x,y,r,r*.45,0,0,TAU);c.stroke();}
function glow(c,x,y,r,color){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
function seal(c,x,y,size,color){c.save();c.translate(x,y);c.fillStyle='#e8d7b4';c.fillRect(-size*.35,-size*.6,size*.7,size*1.2);line(c,[[-size*.2,-size*.3],[size*.2,-size*.3],[-size*.15,0],[size*.17,size*.25],[-size*.17,size*.4]],color,2);c.restore();}
function paint({id,variant:v,ctx:c},u){c.clearRect(0,0,480,220);c.fillStyle='#202924';c.fillRect(0,0,480,220);c.strokeStyle='#394137';c.lineWidth=1;for(let i=0;i<8;i++)line(c,[[i*70-50,220],[i*70+100,0]],'#333c33',1);ring(c,110,155,23,'#384740');c.fillStyle='#759bb3';c.beginPath();c.moveTo(110,105);c.lineTo(94,151);c.lineTo(127,151);c.closePath();c.fill();c.fillStyle='#e2c795';c.beginPath();c.arc(110,98,9,0,TAU);c.fill();c.fillStyle='#84564e';c.beginPath();c.arc(352,123,14,0,TAU);c.fill();ring(c,352,147,20,'#55453b');
 const p=Math.min(1,u*1.6),x=130+p*220,cyan='#bdf8ff',gold='#f7dc91';c.globalAlpha=u>.84?(1-u)/.16:1;
 if(id==='katana'){if(v===0){c.strokeStyle=gold;c.lineWidth=5;c.beginPath();c.arc(x,124,43,-1,1);c.stroke();c.strokeStyle=cyan;c.lineWidth=12;c.beginPath();c.arc(x-7,124,41,-1,1);c.stroke();line(c,[[x-82,123],[x-20,123]],'#528da2',3);}else{line(c,[[x-100,149],[x+25,100]],'#090c13',20);line(c,[[x-98,145],[x+25,100]],gold,3);line(c,[[x-67,140],[x+13,106]],'#eeeecc',1);}}
 if(id==='barrier'){const r=80+Math.min(1,u*4)*55;ring(c,235,144,r,v?gold:cyan,4);ring(c,235,144,r-12,v?'#a25140':'#4b9dae',1);for(let i=0;i<8;i++){const a=i*TAU/8,px=235+Math.cos(a)*r,py=144+Math.sin(a)*r*.45;if(v)seal(c,px,py,18,'#a44437');else{line(c,[[px-8,py],[px-8,py-32],[px+8,py-32],[px+8,py]],'#84e5ff',3);line(c,[[px-13,py-35],[px+13,py-35]],gold,2);glow(c,px,py-15,30,'#79cced28');}}}
 if(id==='needle')for(let i=0;i<8;i++){const yy=124+(i-3.5)*12*(.5+p);line(c,[[x-70,124+(i-3.5)*8],[x-37,yy],[x+5,yy]],v?gold:cyan,v?2:3);if(v){line(c,[[x-1,yy-5],[x-1,yy+5]],cyan,1);line(c,[[x-6,yy],[x+4,yy]],cyan,1);}else{c.fillStyle=cyan;c.beginPath();c.moveTo(x+8,yy);c.lineTo(x-7,yy-4);c.lineTo(x-3,yy+4);c.closePath();c.fill();}}
 if(id==='boom'){const age=Math.max(0,u-.28),r=age*180;glow(c,330,134,40*(1-age),'#ffe39b77');if(v){c.fillStyle='#e5dec9';c.beginPath();c.arc(330,134,20,0,TAU);c.fill();c.fillStyle='#121725';c.beginPath();c.arc(330,134,20,Math.PI/2,Math.PI*1.5);c.fill();for(let i=0;i<10;i++){const a=i*TAU/10;line(c,[[330+Math.cos(a)*r,134+Math.sin(a)*r*.5],[330+Math.cos(a)*(r+16),134+Math.sin(a)*(r+16)*.5]],'#edab6a',5);}}else{seal(c,330,134,26,'#ab463d');ring(c,330,134,r,gold,3);ring(c,330,134,r*.7,'#b86d48',1);}}
 if(id==='fire')for(let i=0;i<6;i++){const a=i*TAU/6-u*4,px=180+p*130+Math.cos(a)*45*(1-p*.6),py=124+Math.sin(a)*35;glow(c,px,py,23,'#73dfce44');if(v){seal(c,px,py,12,'#328d93');c.fillStyle='#e1ffd7';c.fillRect(px-3,py-3,6,6);}else{c.fillStyle='#a7e5d6';c.beginPath();c.moveTo(px+12,py);c.lineTo(px+3,py-9);c.lineTo(px-1,py-3);c.lineTo(px-18,py-7);c.lineTo(px-8,py+5);c.lineTo(px+7,py+7);c.closePath();c.fill();line(c,[[px-14,py],[px-32,py-4]],'#56a7b0',2);}}
 if(id==='thunder'){if(v){for(let i=0;i<4;i++){const a=i*TAU/4,px=300+Math.cos(a)*88,py=141+Math.sin(a)*38;line(c,[[px-10,py],[px-10,py-44],[px+10,py-44],[px+10,py]],cyan,2);line(c,[[px-17,py-48],[px+17,py-48]],gold,3);}ring(c,300,141,88,'#a6baf3',2);}else{ring(c,315,32,24,gold,2);ring(c,315,32,17,'#a2bbf1',1);}if(u>.16){line(c,[[315,28],[298,65],[320,75],[302,111],[318,145]],'#8abef4',9);line(c,[[315,28],[298,65],[320,75],[302,111],[318,145]],'#ecfaff',2);for(let i=0;i<5;i++){const a=i*TAU/5;line(c,[[318,145],[318+Math.cos(a)*38,145+Math.sin(a)*18],[318+Math.cos(a)*78,145+Math.sin(a)*32]],cyan,2);}}}c.globalAlpha=1;}
function frame(t){if(!paused)clock+=Math.min(.05,(t-last)/1000||0);last=t;const u=paused?(clock?clock%2.4/2.4:.38):clock%2.4/2.4;cards.forEach(card=>paint(card,u));requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
