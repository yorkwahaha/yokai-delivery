<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yokai Delivery — 第二刀妖怪美術對照</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif}
  body{margin:0;background:#242329;color:#ead9bc;padding:20px}
  header{max-width:1120px;margin:auto auto 20px}
  h1{font-size:24px;margin:0 0 8px;font-weight:700}
  p{color:#c4b39f;margin:6px 0;line-height:1.6}
  main{max-width:1120px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
  article{background:#2f2f32;border:1px solid #74654f;border-radius:8px;overflow:hidden}
  h2{font-size:17px;margin:0;padding:10px 14px;background:#332b29}
  .compare{display:grid;grid-template-columns:1fr 1fr}
  figure{margin:0;border-right:1px solid #776449}
  figure:last-child{border-right:0}
  .scene{height:190px;display:flex;align-items:center;justify-content:center;
    background:#59574c url("../../assets/img/scenery/ground.webp") center/260px}
  img{display:block;object-fit:contain;max-width:95%;max-height:168px;filter:drop-shadow(0 4px 2px #1d171c)}
  figcaption{text-align:center;padding:8px;color:#eedaba;font-size:13px;background:#252328}
  footer{max-width:1120px;margin:22px auto;color:#c4b39f;font-size:13px}
</style>
<header>
  <h1>妖怪美術第二刀・接圖對照</h1>
  <p>舊圖在左、已接入遊戲的木版畫新圖在右。此頁只展示立繪；遊戲中的移動與攻擊圖組也已使用同一畫法。</p>
  <p>每隻妖怪仍沿用原本的透明輪廓、影格裁切和大小。按正式遊戲比例檢查時，請進入遊戲實測。</p>
</header>
<main id="gallery"></main>
<footer>使用本機檔案直接開啟：assets/img/yokai 為新版來源。未提交或部署。</footer>
<script>
const gallery=document.getElementById("gallery");
for(const [name,label] of Object.entries({ghost:"浮遊幽靈",runner:"疾走妖",tank:"盾甲妖",shooter:"遠射妖",mis:"誤配妖",boss:"大妖 Boss"})){
  const article=document.createElement("article");
  article.innerHTML=`<h2>${label}</h2><div class="compare">
  <figure><div class="scene"><img alt="原版 ${label}" src="../../assets/img/${name}.webp"></div><figcaption>改造前</figcaption></figure>
  <figure><div class="scene"><img alt="新版 ${label}" src="../../assets/img/yokai/${name}.webp"></div><figcaption>半水墨＋浮世繪</figcaption></figure>
  </div>`;
  gallery.append(article);
}
</script>
</html>
